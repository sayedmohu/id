<!DOCTYPE html>
<html>
<head>
    <title>Long ID Card PDF Generator</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 15px;
            background: #f8f8f8;
        }

        .section {
            margin-bottom: 20px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
            padding: 18px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 16px #0001;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 1rem;
        }

        input[type="file"],
        input[type="text"] {
            margin-bottom: 10px;
            width: 100%;
            font-size: 1.08rem;
            padding: 8px 6px;
            box-sizing: border-box;
        }

        .preview-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }

        .preview-box {
            width: 110px;
            height: 110px;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fafafa;
            font-size: 0.8rem;
            color: #888;
            flex-shrink: 0;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        .preview-placeholder {
            font-size: 0.78rem;
            color: #aaa;
            text-align: center;
            pointer-events: none;
        }

        button {
            width: 100%;
            padding: 14px 0;
            font-size: 1.15rem;
            background: #2997FF;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        button:hover {
            background: #147edb;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            h2 {
                font-size: 1.25rem;
            }

            .section {
                padding: 10px;
            }

            label,
            input[type="file"],
            input[type="text"],
            button,
            p {
                font-size: 1rem;
            }
        }

        p {
            color: #555;
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <h2>Long ID Card PDF Generator</h2>

    <div class="section">

        <label for="pdfName">Enter PDF Name:</label>

        <input
            type="text"
            id="pdfName"
            placeholder="Enter file name (without .pdf)"
        >

        <label for="idImage">Upload ID Card Image:</label>

        <div class="preview-wrapper">

            <input
                type="file"
                id="idImage"
                accept="image/*"
            >

            <div class="preview-box">

                <img id="imagePreview" alt="ID card preview">

                <span
                    class="preview-placeholder"
                    id="imagePlaceholder"
                >
                    No image
                </span>

            </div>

        </div>

        <button id="generateButton" onclick="generatePDF()">
            Generate PDF
        </button>

        <p>
            Your ID card image will be automatically resized
            to fit an A4 page while maintaining its original
            proportions.
        </p>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>

        // IMAGE PREVIEW

        const imageInput = document.getElementById('idImage');

        const imagePreview = document.getElementById('imagePreview');

        const imagePlaceholder = document.getElementById('imagePlaceholder');

        imageInput.addEventListener('change', function () {

            const file = imageInput.files[0];

            if (!file) {
                resetPreview();
                return;
            }

            if (!file.type.startsWith('image/')) {

                alert('Please select an image file.');

                imageInput.value = '';

                resetPreview();

                return;
            }

            const reader = new FileReader();

            reader.onload = function (e) {

                imagePreview.src = e.target.result;

                imagePreview.style.display = 'block';

                imagePlaceholder.style.display = 'none';

            };

            reader.onerror = function () {

                alert('Unable to read the selected image.');

                resetPreview();

            };

            reader.readAsDataURL(file);

        });


        // RESET IMAGE PREVIEW

        function resetPreview() {

            imagePreview.style.display = 'none';

            imagePreview.removeAttribute('src');

            imagePlaceholder.style.display = '';

        }


        // GENERATE PDF

        async function generatePDF() {

            const nameInput = document
                .getElementById('pdfName')
                .value.trim();

            const imageFile = imageInput.files[0];

            const button = document.getElementById('generateButton');

            // VALIDATION

            if (!nameInput) {

                alert('Please enter a name for the PDF.');

                return;

            }

            if (!imageFile) {

                alert('Please upload an ID card image.');

                return;

            }

            if (!imageFile.type.startsWith('image/')) {

                alert('Please select a valid image file.');

                return;

            }

            button.disabled = true;

            button.textContent = 'Generating PDF...';

            try {

                // LOAD IMAGE

                const imageData = await new Promise((resolve, reject) => {

                    const reader = new FileReader();

                    reader.onload = () => resolve(reader.result);

                    reader.onerror = () => reject(
                        new Error('Unable to read image.')
                    );

                    reader.readAsDataURL(imageFile);

                });


                const img = await new Promise((resolve, reject) => {

                    const image = new Image();

                    image.onload = () => resolve(image);

                    image.onerror = () => reject(
                        new Error('Unable to load image.')
                    );

                    image.src = imageData;

                });


                // CONVERT IMAGE TO PNG
                // This also handles formats that jsPDF
                // may not directly support.

                const canvas = document.createElement('canvas');

                canvas.width = img.naturalWidth;

                canvas.height = img.naturalHeight;

                const ctx = canvas.getContext('2d');

                ctx.drawImage(img, 0, 0);

                const pngData = canvas.toDataURL('image/png');


                // A4 PAGE DIMENSIONS

                const { jsPDF } = window.jspdf;

                const doc = new jsPDF({

                    orientation: 'portrait',

                    unit: 'mm',

                    format: 'a4'

                });

                const pageWidth = 210;

                const pageHeight = 297;

                // FIXED ID CARD WIDTH: 10 CM (100 MM)

                const imageWidth = 100;


                // ADJUST HEIGHT TO PRESERVE THE UPLOADED IMAGE'S ASPECT RATIO

                const imageRatio = img.naturalWidth / img.naturalHeight;

                const imageHeight = imageWidth / imageRatio;


                // CENTRE IMAGE ON A4 PAGE

                // The image is not automatically reduced if its height exceeds the page.

                const x = (pageWidth - imageWidth) / 2;

                const y = (pageHeight - imageHeight) / 2;


                // ADD IMAGE TO PDF

                doc.addImage(

                    pngData,

                    'PNG',

                    x,

                    y,

                    imageWidth,

                    imageHeight,

                    undefined,

                    'FAST'

                );


                // TIMESTAMP

                const now = new Date();

                const timestamp =

                    String(now.getDate()).padStart(2, '0') +

                    String(now.getMonth() + 1).padStart(2, '0') +

                    now.getFullYear().toString() + '_' +

                    String(now.getHours()).padStart(2, '0') +

                    String(now.getMinutes()).padStart(2, '0') +

                    String(now.getSeconds()).padStart(2, '0');


                // CLEAN PDF NAME

                const safeName = nameInput

                    .replace(/[^a-zA-Z0-9_\- ]/g, '')

                    .replace(/\s+/g, '_');


                const filename = `${safeName}_${timestamp}.pdf`;


                // DOWNLOAD PDF

                doc.save(filename);

                alert('PDF generated and downloaded successfully!');

            }

            catch (error) {

                console.error(error);

                alert('Something went wrong while generating the PDF.');

            }

            finally {

                button.disabled = false;

                button.textContent = 'Generate PDF';

            }

        }

    </script>

</body>
</html>
